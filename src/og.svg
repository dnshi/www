<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06080e"/>
      <stop offset="100%" stop-color="#0a0e18"/>
    </linearGradient>
    <linearGradient id="name" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cdd9ee"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5ef2c9"/>
      <stop offset="100%" stop-color="#38e8ff"/>
    </linearGradient>
    <radialGradient id="glow1" cx="15%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#5ef2c9" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#5ef2c9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="85%" cy="15%" r="45%">
      <stop offset="0%" stop-color="#7aa2ff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#7aa2ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- subtle grid -->
  <rect width="1200" height="630" fill="none" stroke="rgba(150,180,230,0.06)" stroke-width="0"/>
  <line x1="0" y1="315" x2="1200" y2="315" stroke="rgba(150,180,230,0.07)" stroke-width="1"/>
  <line x1="600" y1="0" x2="600" y2="630" stroke="rgba(150,180,230,0.07)" stroke-width="1"/>

  <!-- border -->
  <rect x="1" y="1" width="1198" height="628" fill="none" stroke="rgba(150,180,230,0.12)" stroke-width="1" rx="0"/>

  <!-- top accent bar -->
  <rect x="80" y="80" width="60" height="3" fill="url(#accent)" rx="2"/>

  <!-- monogram badge -->
  <rect x="80" y="108" width="64" height="64" fill="url(#accent)" rx="14"/>
  <text x="112" y="151" font-family="system-ui,-apple-system,sans-serif" font-size="22" font-weight="700" fill="#06080e" text-anchor="middle">DS</text>

  <!-- name -->
  <text x="80" y="290" font-family="system-ui,-apple-system,sans-serif" font-size="112" font-weight="700" letter-spacing="-4" fill="url(#name)">Dean Shi</text>

  <!-- title -->
  <text x="80" y="348" font-family="system-ui,-apple-system,sans-serif" font-size="28" font-weight="500" fill="#93a3bd" letter-spacing="0.5">Senior Frontend / Platform Engineer</text>

  <!-- divider -->
  <rect x="80" y="376" width="1040" height="1" fill="rgba(150,180,230,0.14)"/>

  <!-- tags -->
  <rect x="80" y="406" width="220" height="40" fill="rgba(94,242,201,0.1)" rx="20" stroke="rgba(94,242,201,0.3)" stroke-width="1"/>
  <text x="190" y="431" font-family="system-ui,-apple-system,sans-serif" font-size="16" font-weight="500" fill="#5ef2c9" text-anchor="middle">Micro-frontends</text>

  <rect x="316" y="406" width="248" height="40" fill="rgba(94,242,201,0.1)" rx="20" stroke="rgba(94,242,201,0.3)" stroke-width="1"/>
  <text x="440" y="431" font-family="system-ui,-apple-system,sans-serif" font-size="16" font-weight="500" fill="#5ef2c9" text-anchor="middle">High-traffic platforms</text>

  <rect x="580" y="406" width="210" height="40" fill="rgba(94,242,201,0.1)" rx="20" stroke="rgba(94,242,201,0.3)" stroke-width="1"/>
  <text x="685" y="431" font-family="system-ui,-apple-system,sans-serif" font-size="16" font-weight="500" fill="#5ef2c9" text-anchor="middle">Web performance</text>

  <rect x="806" y="406" width="178" height="40" fill="rgba(94,242,201,0.1)" rx="20" stroke="rgba(94,242,201,0.3)" stroke-width="1"/>
  <text x="895" y="431" font-family="system-ui,-apple-system,sans-serif" font-size="16" font-weight="500" fill="#5ef2c9" text-anchor="middle">CSS architecture</text>

  <!-- url -->
  <text x="80" y="550" font-family="ui-monospace,monospace" font-size="20" font-weight="400" fill="#5d6c87" letter-spacing="1">deanshi.com</text>

  <!-- stars (decorative) -->
  <circle cx="980" cy="180" r="1.5" fill="rgba(180,210,240,0.6)"/>
  <circle cx="1050" cy="240" r="1" fill="rgba(180,210,240,0.4)"/>
  <circle cx="1100" cy="160" r="2" fill="rgba(180,210,240,0.5)"/>
  <circle cx="1020" cy="300" r="1" fill="rgba(180,210,240,0.35)"/>
  <circle cx="1130" cy="280" r="1.5" fill="rgba(180,210,240,0.45)"/>
  <circle cx="960" cy="350" r="1" fill="rgba(180,210,240,0.3)"/>
  <line x1="980" y1="180" x2="1050" y2="240" stroke="rgba(94,242,201,0.12)" stroke-width="0.8"/>
  <line x1="1050" y1="240" x2="1100" y2="160" stroke="rgba(94,242,201,0.1)" stroke-width="0.8"/>
  <line x1="1050" y1="240" x2="1020" y2="300" stroke="rgba(94,242,201,0.1)" stroke-width="0.8"/>
  <line x1="1100" y1="160" x2="1130" y2="280" stroke="rgba(94,242,201,0.08)" stroke-width="0.8"/>
</svg>
